global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "simulator"
    scrape_interval: 5s
    static_configs:
      - targets: ["simulator:8080"]

  - job_name: "monitoring"
    scrape_interval: 5s
    static_configs:
      - targets: ["monitoring:8081"]

  - job_name: "analysis"
    scrape_interval: 5s
    static_configs:
      - targets: ["analysis:8082"]

