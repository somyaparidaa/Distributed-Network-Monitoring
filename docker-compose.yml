services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: netmon-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "4L62EnnTQgah3K4tPOYqGg"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7.4-alpine
    container_name: netmon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    volumes:
      - redis-data:/data

  simulator:
    build:
      context: .
      dockerfile: docker/simulator.Dockerfile
    container_name: netmon-simulator
    ports:
      - "8080:8080"
    environment:
      - SIMULATOR_ADDR=:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  monitoring:
    build:
      context: .
      dockerfile: docker/monitoring.Dockerfile
    container_name: netmon-monitoring
    ports:
      - "8081:8081"
    depends_on:
      simulator:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SIMULATOR_URL=http://simulator:8080
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_ENABLED=true
      - MONITORING_HTTP_ADDR=:8081
      - POLL_INTERVAL=2s
      - POLL_TIMEOUT=1s
      - MAX_RETRIES=2
      - RETRY_BACKOFF=50ms
      - FAILURE_THRESHOLD=3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  analysis:
    build:
      context: .
      dockerfile: docker/analysis.Dockerfile
    container_name: netmon-analysis
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_ENABLED=true
      - KAFKA_CONSUMER_GROUP=analysis-service
      - REDIS_ADDR=redis:6379
      - REDIS_ENABLED=true
      - REDIS_DB=0
      - REDIS_KEY_PREFIX=analysis
      - ANALYSIS_HTTP_ADDR=:8082
      - AGGREGATION_WINDOWS=1m,5m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: netmon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  grafana:
    image: grafana/grafana:11.1.0
    container_name: netmon-grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Local demo development credentials (not production secrets)
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  kafka-data:
  redis-data:
  prometheus-data:
  grafana-data:

